<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>E-Book AQIDAH AKHLAK - SMKS Al Manar</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#fdf8ee;--paper:#fffdf7;--text:#222;--accent:#0f766e;--muted:#777;--line:#e8ddd0;--card:#fff}
body.dark{--bg:#121212;--paper:#1e1e1e;--text:#eee;--accent:#2dd4bf;--muted:#aaa;--line:#333;--card:#222}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:10;background:var(--bg);padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
header b{font-size:18px}
button{border:1px solid var(--line);background:var(--card);color:var(--text);padding:9px 10px;border-radius:10px;cursor:pointer;font-size:13px}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
input,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font-size:14px}
.tabs{display:flex;gap:6px;padding:10px 14px;overflow-x:auto}
.tabs button{white-space:nowrap}
.tabs button.active{background:var(--accent);color:#fff}
.wrap{max-width:720px;margin:0 auto;padding:0 14px 110px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.small{font-size:12px;color:var(--muted)}
.book{width:100%;min-height:58vh;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:22px 20px;box-shadow:0 6px 20px rgba(0,0,0,.08);line-height:1.8;font-size:17px;white-space:pre-wrap;word-wrap:break-word}
.pager{display:flex;justify-content:space-between;align-items:center;margin:12px 0;gap:8px}
.pager button{flex:1;padding:12px}
.progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0}
.progress i{display:block;height:100%;background:var(--accent);width:0%}
.row{display:flex;gap:8px}.row>*{flex:1}
.chip{display:inline-block;padding:4px 8px;border:1px solid var(--line);border-radius:99px;font-size:11px;margin:2px}
.hidden{display:none!important}
mark{background:#fde047;color:#000;padding:0 2px;border-radius:3px}
.toolbar{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:8px;justify-content:center}
.toolbar button{flex:1;max-width:150px}
label{font-size:13px;font-weight:600;display:block;margin:12px 0 6px}
</style>
</head>
<body>
<header><div><b id="bookTitle">📚 E-Book AQIDAH AKHLAK Al Manar</b><div class="small" id="bookMeta">SMKS Al Manar • Akhlak & Aqidah</div></div><button onclick="toggleDark()">🌙 / ☀️</button></header>
<div class="tabs"><button class="active" onclick="showTab('read')">📖 Baca</button><button onclick="showTab('toc')">📑 Daftar Isi</button><button onclick="showTab('search')">🔍 Cari</button><button onclick="showTab('marks')">🔖 Bookmark & Catatan</button><button onclick="showTab('manage')">⚙️ Kelola Buku</button></div>
<div class="wrap">
<div id="view-read">
<div class="card"><div class="row"><input id="searchQuick" placeholder="Cari kata di halaman ini... Tekan Enter" onkeydown="if(event.key==='Enter') searchInPage()"><button onclick="searchInPage()">Cari</button></div><div class="progress"><i id="prog"></i></div><div class="small" id="pageInfo">Bab - / Halaman -</div></div>
<div class="book" id="pageBox" onclick="nextPage()">Ketuk untuk mulai membaca.</div>
<div class="pager"><button onclick="prevPage()">◀ Sebelumnya</button><button class="primary" onclick="toggleBookmark()">🔖 Bookmark</button><button onclick="nextPage()">Berikutnya ▶</button></div>
<div class="card"><label>✏️ Catatan untuk halaman ini</label><textarea id="noteInput" rows="3" placeholder="Tulis catatanmu... misal: bagian ini penting untuk ulangan Jumat / Senin"></textarea><button class="primary" style="margin-top:8px" onclick="saveNote()">Simpan Catatan</button></div>
</div>
<div id="view-toc" class="hidden"><div class="card"><b>📑 Daftar Isi</b><div id="tocList" style="margin-top:10px"></div></div></div>
<div id="view-search" class="hidden"><div class="card"><label>Cari di seluruh buku</label><input id="searchAll" placeholder="Ketik kata... misal: aqidah, jujur, iman"><button class="primary" style="margin-top:8px" onclick="searchAll()">Cari Sekarang</button><div id="searchResult" style="margin-top:12px"></div></div></div>
<div id="view-marks" class="hidden"><div class="card"><b>🔖 Bookmark Saya</b><div id="bookmarkList"></div></div><div class="card"><b>📝 Semua Catatan Saya</b><div id="noteList"></div><hr style="margin:12px 0;border:1px solid var(--line)"><div class="row"><button onclick="exportNotes()">⬇️ Ekspor Catatan</button><button onclick="document.getElementById('importFile').click()">⬆️ Impor Catatan</button></div><input type="file" id="importFile" accept=".json" class="hidden" onchange="importNotes(event)"></div></div>
<div id="view-manage" class="hidden"><div class="card"><b>⚙️ Info Buku</b><label>Judul Buku</label><input id="inpTitle"><label>Nama Penulis / Guru</label><input id="inpAuthor"><button class="primary" style="margin-top:10px" onclick="saveMeta()">Simpan Info Buku</button></div><div class="card"><b>➕ Tambah / Edit Bab</b><label>Judul Bab</label><input id="inpChTitle"><label>Isi Bab</label><textarea id="inpChBody" rows="8"></textarea><button class="primary" style="margin-top:8px" onclick="addChapter()">Tambah Bab</button></div><div class="card"><b>📚 Daftar Bab</b><div id="manageList"></div></div><div class="card"><b>💾 Backup Buku</b><div class="row"><button onclick="exportBook()">⬇️ Ekspor Buku</button><button onclick="document.getElementById('importBook').click()">⬆️ Impor Buku</button></div><input type="file" id="importBook" accept=".json" class="hidden" onchange="importBook(event)"><button style="margin-top:8px;width:100%;color:#dc2626" onclick="resetAll()">🗑️ Hapus Semua & Mulai Kosong</button></div></div>
</div>
<div class="toolbar"><button onclick="showTab('toc')">📑 Isi</button><button onclick="prevPage()">◀ Prev</button><button class="primary" onclick="showTab('read')">📖 Baca</button><button onclick="nextPage()">Next ▶</button><button onclick="showTab('marks')">🔖 Simpan</button></div>
<script>
let DB = JSON.parse(localStorage.getItem('ebook_almanar_final')||'null') || {
 title:"E-Book AQIDAH AKHLAK - SMKS Al Manar", author:"SMKS Al Manar - Guru AQIDAH AKHLAK",
 chapters:[
  {title:"Bab 1 - Akhlak: Pengertian dan Dalilnya", body:"E-BOOK PAI SMKS AL MANAR\n\nBAB 1 - AKHLAK\n\n1. Pengertian Akhlak\nAkhlak adalah sikap, perilaku, dan budi pekerti yang lahir dari hati dan menjadi kebiasaan dalam kehidupan sehari-hari.\n\nAkhlak berasal dari bahasa Arab 'khuluq' yang artinya perangai atau tabiat.\n\nJika hatinya baik, maka perilakunya akan baik. Jika hatinya buruk, perilakunya pun akan buruk.\n\n2. Dalil Akhlak\nRasulullah SAW bersabda:\n'Sesungguhnya aku diutus untuk menyempurnakan akhlak yang mulia.' (HR. Ahmad)\n\nAllah SWT berfirman tentang Nabi Muhammad SAW:\n'Dan sesungguhnya kamu benar-benar berbudi pekerti yang agung.' (QS. Al-Qalam: 4)\n\n3. Akhlak Terhadap Allah SWT\n- Bersyukur atas nikmat Allah\n- Ikhlas dalam beribadah\n- Sabar saat diberi ujian\n- Tawakkal setelah berusaha\n\n4. Akhlak Terhadap Sesama Manusia\n- Jujur: berkata benar, tidak mencontek saat ulangan\n- Amanah: menjaga titipan, mengerjakan tugas tepat waktu\n- Hormat kepada orang tua dan guru\n- Tolong-menolong dan peduli kepada teman\n- Sopan dalam berbicara dan bermedia sosial\n\n5. Akhlak Terhadap Diri Sendiri dan Lingkungan\n- Menjaga kebersihan diri dan kelas\n- Disiplin bangun pagi dan sholat tepat waktu\n- Tidak membuang sampah sembarangan\n- Menjaga nama baik sekolah\n\n6. Contoh Akhlak dalam Kehidupan Sehari-hari di Sekolah\n- Mengucapkan salam saat bertemu guru\n- Tidak berkata kasar kepada teman\n- Mengembalikan barang yang ditemukan\n- Meminta maaf jika berbuat salah\n- Antri dengan tertib saat di kantin\n\nKesimpulan: Akhlak adalah cerminan iman. Orang yang imannya kuat, akhlaknya pasti baik. Mari kita biasakan akhlak mulia mulai dari hal kecil."},
  {title:"Bab 2 - Akhlak Tercela yang Harus Dijauhi", body:"BAB 2 - AKHLAK TERCELA YANG HARUS DIJAUHI\n\nAkhlak tercela adalah perilaku buruk yang dilarang Allah dan merugikan diri sendiri serta orang lain.\n\n1. Berbohong / Dusta\nBerkata tidak sesuai kenyataan. Contoh: berbohong kepada guru soal tugas, mencontek tapi mengaku mengerjakan sendiri.\nAkibatnya: tidak dipercaya orang, hati tidak tenang.\n\n2. Sombong / Takabbur\nMerasa diri paling hebat, merendahkan orang lain. Contoh: menghina teman yang nilainya rendah.\nPadahal semua kelebihan adalah titipan Allah.\n\n3. Iri / Dengki (Hasad)\nTidak senang melihat orang lain senang. Contoh: iri saat teman dapat ranking 1.\nSeharusnya kita ikut senang dan termotivasi untuk belajar lebih giat.\n\n4. Marah yang Tidak Terkendali\nMudah emosi, berkata kasar, bahkan memukul teman.\nRasulullah mengajarkan: orang kuat bukanlah yang menang bergulat, tapi yang bisa menahan marah.\n\n5. Malas dan Tidak Disiplin\nMalas belajar, malas sholat, sering terlambat. Ini akan merugikan masa depan kita sendiri.\n\n6. Cara Menghindari Akhlak Tercela\n- Perbanyak istighfar dan berdoa\n- Bergaul dengan teman yang baik\n- Ingat bahwa Allah selalu melihat kita\n- Biasakan jujur meski pahit\n- Latih sabar setiap hari\n\nTugas Renungan:\nTuliskan 1 akhlak tercela yang ingin kamu ubah minggu ini, dan apa cara mengubahnya. Tulis di Catatan di e-book ini."},
  {title:"Bab 3 - Aqidah: Pengertian dan Rukun Iman", body:"BAB 3 - AQIDAH\n\n1. Pengertian Aqidah\nAqidah adalah keyakinan yang mengikat hati, yang diyakini dengan sungguh-sungguh dan tidak ragu sedikit pun.\n\nAqidah berasal dari kata 'aqada' yang artinya mengikat. Jadi aqidah itu mengikat hati kita kepada Allah.\n\nAqidah yang benar akan membuat ibadah kita benar dan akhlak kita baik.\n\n2. Dalil Aqidah\nAllah berfirman:\n'Wahai orang-orang yang beriman, tetaplah beriman kepada Allah dan Rasul-Nya.' (QS. An-Nisa: 136)\n\n3. Rukun Iman Ada 6:\n\n1) Iman kepada Allah SWT\nYakin bahwa Allah itu ada, Maha Esa, Maha Kuasa, tempat kita meminta dan bergantung.\nContoh: berdoa hanya kepada Allah, tidak percaya jimat.\n\n2) Iman kepada Malaikat Allah\nYakin malaikat itu ada dan selalu taat kepada Allah. Contoh: Malaikat Jibril menyampaikan wahyu, Malaikat Raqib dan Atid mencatat amal kita.\n\n3) Iman kepada Kitab-kitab Allah\nYakin Allah menurunkan kitab suci. Contoh: Taurat, Zabur, Injil, dan Al-Quran. Al-Quran adalah kitab terakhir dan penyempurna.\n\n4) Iman kepada Rasul-rasul Allah\nYakin Allah mengutus para rasul untuk membimbing manusia. Contoh: Nabi Adam AS sampai Nabi Muhammad SAW. Nabi Muhammad adalah nabi terakhir.\n\n5) Iman kepada Hari Akhir / Hari Kiamat\nYakin bahwa dunia ini akan berakhir dan ada kehidupan akhirat. Ada surga dan neraka. Amal kita akan dibalas.\n\n6) Iman kepada Qada dan Qadar (Takdir)\nYakin bahwa segala sesuatu sudah ditetapkan Allah. Kita wajib berusaha, berdoa, lalu tawakkal. Contoh: sudah belajar sungguh-sungguh, hasil diserahkan kepada Allah.\n\n4. Fungsi Aqidah dalam Kehidupan\n- Memberi ketenangan hati\n- Membuat kita tidak mudah putus asa\n- Menjadi dasar dalam beribadah dan berakhlak\n- Menjauhkan dari perbuatan syirik\n\nKesimpulan: Aqidah itu seperti fondasi rumah. Jika fondasinya kuat, rumahnya kokoh. Jika aqidahnya kuat, hidup kita akan lurus."},
  {title:"Bab 4 - Aqidah yang Benar vs Aqidah yang Salah", body:"BAB 4 - AQIDAH YANG BENAR VS YANG SALAH\n\n1. Ciri Aqidah yang Benar\n- Tauhid: hanya menyembah Allah SWT, tidak menyekutukan-Nya\n- Sesuai Al-Quran dan Sunnah Rasulullah SAW\n- Yakin sepenuh hati, tidak ragu\n- Membuahkan ibadah yang rajin dan akhlak yang baik\n\n2. Contoh Aqidah yang Salah (Syirik)\nSyirik adalah menyekutukan Allah. Ini dosa yang paling besar.\n\nContoh syirik yang harus dijauhi:\n- Percaya kepada jimat, dukun, atau ramalan\n- Meminta pertolongan kepada selain Allah, misal kepada kuburan keramat\n- Percaya bahwa ada kekuatan lain yang bisa memberi rezeki selain Allah\n- Riya: beribadah agar dipuji orang, bukan karena Allah\n\nAllah berfirman:\n'Sesungguhnya Allah tidak akan mengampuni dosa syirik.' (QS. An-Nisa: 48)\n\n3. Hubungan Aqidah dan Akhlak\nAqidah dan Akhlak tidak bisa dipisahkan.\n\n- Jika aqidahnya benar, akhlaknya akan baik. Karena dia merasa Allah selalu melihatnya.\n- Jika aqidahnya lemah, akhlaknya mudah rusak. Karena dia tidak takut kepada Allah.\n\nContoh: Siswa yang yakin Allah melihatnya, tidak akan mencontek walau tidak ada guru yang mengawasi.\n\n4. Cara Menjaga Aqidah\n- Belajar ilmu agama dengan benar, bertanya kepada guru\n- Membaca Al-Quran dan memahami artinya\n- Bergaul dengan teman yang mengingatkan kepada kebaikan\n- Berdoa agar ditetapkan imannya\n- Menjauhi konten yang merusak iman di media sosial\n\nDoa Menjaga Iman:\n'Ya Allah, tetapkanlah hatiku di atas agama-Mu.'\n\nPenutup:\nSemoga setelah belajar Akhlak dan Aqidah ini, kita menjadi siswa SMKS Al Manar yang beriman, berakhlak mulia, dan membanggakan orang tua, guru, dan sekolah.\n\nSiap Ulangan:\n- Ulangan Akhlak: Hari Jumat\n- Ulangan Aqidah: Hari Senin\nBelajarlah dari e-book ini. Semangat!"}
 ],
 bookmarks:[], notes:[]
};
let curCh=0, curPage=0, pages=[];
function save(){localStorage.setItem('ebook_almanar_final', JSON.stringify(DB)); renderAll();}
function paginate(){pages=[]; DB.chapters.forEach((c,ci)=>{let t=c.title+"\\n\\n"+c.body; let chunks=[]; for(let i=0;i<t.length;i+=900) chunks.push(t.slice(i,i+900)); chunks.forEach((txt,pi)=>pages.push({ch:ci,page:pi,total:chunks.length,text:txt}));}); if(!pages.length) pages=[{ch:-1,page:0,total:1,text:"Belum ada bab."}];}
function renderRead(){paginate(); let idx=pages.findIndex(p=>p.ch===curCh&&p.page===curPage); if(idx<0) idx=0; let p=pages[idx]; curCh=p.ch; curPage=p.page; document.getElementById('pageBox').innerText=p.text; document.getElementById('pageInfo').innerText = p.ch>=0 ? `Bab ${p.ch+1} / ${DB.chapters.length} • ${DB.chapters[p.ch].title} • Halaman ${p.page+1} dari ${p.total} • Total ${idx+1}/${pages.length}` : "Belum ada bab"; document.getElementById('prog').style.width = ((idx+1)/pages.length*100)+"%"; document.getElementById('bookTitle').innerText="📚 "+DB.title; document.getElementById('bookMeta').innerText=DB.author+" • "+DB.chapters.length+" Bab • "+pages.length+" Halaman • Online via GitHub"; let key=curCh+"-"+curPage; let n=DB.notes.find(x=>x.key===key); document.getElementById('noteInput').value=n?n.text:"";}
function nextPage(){paginate(); let idx=pages.findIndex(p=>p.ch===curCh&&p.page===curPage); if(idx<pages.length-1){let n=pages[idx+1]; curCh=n.ch; curPage=n.page; renderRead(); window.scrollTo({top:0,behavior:'smooth'});}}
function prevPage(){paginate(); let idx=pages.findIndex(p=>p.ch===curCh&&p.page===curPage); if(idx>0){let n=pages[idx-1]; curCh=n.ch; curPage=n.page; renderRead(); window.scrollTo({top:0,behavior:'smooth'});}}
function showTab(t){['read','toc','search','marks','manage'].forEach(x=>document.getElementById('view-'+x).classList.toggle('hidden', x!==t)); document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active')); if(t==='read') renderRead(); if(t==='toc') renderTOC(); if(t==='marks') renderMarks(); if(t==='manage') renderManage();}
function renderTOC(){document.getElementById('tocList').innerHTML=DB.chapters.map((c,i)=>`<div class="card" onclick="goTo(${i},0)" style="cursor:pointer"><b>${i+1}. ${c.title}</b><div class="small">${c.body.length} huruf • Klik untuk baca</div></div>`).join('')||"Belum ada bab";}
function goTo(ch,pg){curCh=ch; curPage=pg; showTab('read');}
function renderManage(){document.getElementById('inpTitle').value=DB.title; document.getElementById('inpAuthor').value=DB.author; document.getElementById('manageList').innerHTML=DB.chapters.map((c,i)=>`<div class="card"><b>${i+1}. ${c.title}</b><div class="small">${c.body.slice(0,80)}...</div><div class="row" style="margin-top:8px"><button onclick="editCh(${i})">✏️ Edit</button><button onclick="delCh(${i})">🗑️ Hapus</button><button onclick="goTo(${i},0)">📖 Baca</button></div></div>`).join('')||"Kosong";}
function saveMeta(){DB.title=document.getElementById('inpTitle').value||DB.title; DB.author=document.getElementById('inpAuthor').value||DB.author; save(); alert("Tersimpan!");}
function addChapter(){let t=document.getElementById('inpChTitle').value.trim(); let b=document.getElementById('inpChBody').value.trim(); if(!t||!b) return alert("Judul dan isi bab harus diisi!"); DB.chapters.push({title:t,body:b}); document.getElementById('inpChTitle').value=""; document.getElementById('inpChBody').value=""; save(); alert("Bab ditambah!"); renderManage();}
function editCh(i){document.getElementById('inpChTitle').value=DB.chapters[i].title; document.getElementById('inpChBody').value=DB.chapters[i].body; DB.chapters.splice(i,1); save(); alert("Sekarang edit di atas lalu klik Tambah Bab lagi."); renderManage();}
function delCh(i){if(confirm("Hapus bab ini?")){DB.chapters.splice(i,1); save(); renderManage();}}
function toggleDark(){document.body.classList.toggle('dark'); localStorage.setItem('ebook_dark_final', document.body.classList.contains('dark')?'1':'0');}
function toggleBookmark(){let key=curCh+"-"+curPage; let idx=DB.bookmarks.indexOf(key); if(idx>=0){DB.bookmarks.splice(idx,1); alert("Bookmark dihapus");} else {DB.bookmarks.push(key); alert("🔖 Ditandai!");} save();}
function saveNote(){let key=curCh+"-"+curPage; let txt=document.getElementById('noteInput').value.trim(); let ex=DB.notes.find(x=>x.key===key); if(ex) ex.text=txt; else if(txt) DB.notes.push({key:key,text:txt,ch:curCh,page:curPage}); save(); alert("Catatan tersimpan!");}
function renderMarks(){document.getElementById('bookmarkList').innerHTML=DB.bookmarks.map(k=>{let [ch,pg]=k.split('-').map(Number); let c=DB.chapters[ch]; if(!c) return ""; return `<div class="card" onclick="goTo(${ch},${pg})" style="cursor:pointer">🔖 ${c.title} • Halaman ${pg+1} <span class="chip">Klik untuk buka</span></div>`}).join('')||"<div class='small'>Belum ada bookmark</div>"; document.getElementById('noteList').innerHTML=DB.notes.map((n,i)=>`<div class="card"><b>${DB.chapters[n.ch]?.title||'Bab'} • Hal. ${n.page+1}</b><div>${n.text}</div><button style="margin-top:8px" onclick="delNote(${i})">Hapus</button></div>`).join('')||"<div class='small'>Belum ada catatan</div>";}
function delNote(i){DB.notes.splice(i,1); save(); renderMarks();}
function searchInPage(){let q=document.getElementById('searchQuick').value.trim(); if(!q) return renderRead(); let box=document.getElementById('pageBox'); let txt=box.innerText; let re=new RegExp('('+q.replace(/[.*+?^${}()|[\\]\\\\]/g,'\\$&')+')','gi'); box.innerHTML=txt.replace(re,'<mark>$1</mark>');}
function searchAll(){let q=document.getElementById('searchAll').value.trim().toLowerCase(); if(!q) return; let res=[]; DB.chapters.forEach((c,ci)=>{let full=c.title+"\\n"+c.body; let idx=full.toLowerCase().indexOf(q); if(idx>=0) res.push({ci, snippet:full.slice(Math.max(0,idx-60), idx+120)});}); document.getElementById('searchResult').innerHTML=res.map(r=>`<div class="card" onclick="goTo(${r.ci},0)" style="cursor:pointer"><b>${DB.chapters[r.ci].title}</b><div class="small">...${r.snippet}...</div><span class="chip">Klik untuk buka bab</span></div>`).join('')||"Tidak ditemukan";}
function download(name, data){let a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([data],{type:'application/json'})); a.download=name; a.click();}
function exportNotes(){download('catatan-ebook.json', JSON.stringify({title:DB.title, notes:DB.notes, bookmarks:DB.bookmarks}, null, 2));}
function importNotes(e){let f=e.target.files[0]; if(!f) return; let r=new FileReader(); r.onload=()=>{try{let d=JSON.parse(r.result); if(d.notes) DB.notes=d.notes; if(d.bookmarks) DB.bookmarks=d.bookmarks; save(); renderMarks(); alert
