<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Buat Soal - Al Manar</title><style>body{font-family:sans-serif;padding:15px;background:#f0f2f5}input,textarea,button{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #ccc}button{background:#1877f2;color:#fff;border:none;font-weight:bold}.card{background:#fff;padding:15px;border-radius:12px}</style></head><body>
<h2>📝 Halaman 1 - Buat Soal</h2>
<div class="card">
<input id="judul" placeholder="Judul Ujian" value="IPA Bab 1">
<input id="waktu" type="number" value="30" placeholder="Waktu Menit">
<textarea id="soal" rows="12" placeholder="Format: Soal | A | B | C | D | Kunci"></textarea>
<button onclick="simpan()">SIMPAN & TAMPILKAN QR ➡️</button>
<button style="background:#00a400" onclick="tambahSoal()">➕ TAMBAH SOAL & BUAT QR BARU</button>
<button style="background:#666" onclick="location.href='tampil-qr.html'">👀 LIHAT QR / NILAI</button>
  <button style="background:#ff9800" onclick="location.href='catatan-mapel.html'">📒 BUKA HALAMAN 3 - CATATAN MAPEL</button>
<button style="background:#e74c3c" onclick="buatBaru()">🗑️ BUAT UJIAN BARU (HAPUS SEMUA)</button>
<p id="info" style="font-size:13px;color:#666"></p>
</div>
<script>
// PAS BUKA HALAMAN, CEK ADA SOAL LAMA GAK?
window.onload=()=>{
  let lama=JSON.parse(localStorage.getItem('ujian_aktif')||'null');
  if(lama){
    document.getElementById('judul').value=lama.j;
    document.getElementById('waktu').value=lama.t;
    // UBAH LAGI JADI TEKS: Soal | A | B | C | D | Kunci
    let teks=lama.s.map(s=>{
      let kunciHuruf = s.k;
      // Cari teks jawaban yang benar, biar balik ke format awal
      return `${s.q} | ${s.a} | ${s.b} | ${s.c} | ${s.d} | ${kunciHuruf}`;
    }).join('\n');
    document.getElementById('soal').value=teks;
    document.getElementById('info').innerText=`✅ Soal lama dimuat: ${lama.s.length} soal. Tinggal tambah di bawah, lalu SIMPAN!`;
  }
};
function ambilData(){
  let lines=document.getElementById('soal').value.trim().split('\n').filter(l=>l.trim()!='');
  let soalArr=lines.map(l=>{let p=l.split('|'); return {q:p[0].trim(),a:p[1].trim(),b:p[2].trim(),c:p[3].trim(),d:p[4].trim(),k:p[5].trim()}});
  return {j:document.getElementById('judul').value, t:parseInt(document.getElementById('waktu').value)||30, s:soalArr};
}
function simpan(){
  let data=ambilData();
  if(!data.s.length) return alert("Soal masih kosong, Pak!");
  localStorage.setItem('ujian_aktif', JSON.stringify(data));
  location.href='tampil-qr.html';
}
function tambahSoal(){
  let data=ambilData();
  localStorage.setItem('ujian_aktif', JSON.stringify(data));
  alert("Soal disimpan! Sekarang Bapak bisa tambah soal lagi di bawah, lalu SIMPAN lagi!");
}
function buatBaru(){
  if(confirm("Hapus soal lama & nilai lama, buat ujian baru?")){
    localStorage.removeItem('ujian_aktif');
    localStorage.removeItem('nilai_almanar');
    location.reload();
  }
}
</script></body></html>
