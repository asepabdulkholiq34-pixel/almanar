<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buat Ujian - Pak Guru</title>
<style>
body{font-family:Arial,sans-serif;background:#f1f5f9;margin:0;padding:12px}
.card{background:#fff;padding:16px;border-radius:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
h2{margin:0 0 10px}
input,select,textarea{width:100%;padding:12px;margin:6px 0;border:1px solid #cbd5e1;border-radius:10px;box-sizing:border-box;font-size:15px}
button{width:100%;padding:14px;border:none;border-radius:10px;font-weight:bold;font-size:16px;margin-top:8px;cursor:pointer}
.btn-hijau{background:#16a34a;color:#fff}
.btn-biru{background:#2563eb;color:#fff}
.btn-ungu{background:#7c3aed;color:#fff}
.btn-hitam{background:#111827;color:#fff}
.btn-abu{background:#e2e8f0}
.soal-item{background:#f8fafc;border:1px solid #e2e8f0;padding:10px;border-radius:10px;margin-top:8px}
#qrBox{text-align:center}
#qrBox img{width:260px;height:260px;margin:10px auto;display:block}
#kotakScan{display:none;background:#000;padding:10px;border-radius:12px;margin-top:10px}
</style>
</head>
<body>

<!-- HALAMAN 1 : BUAT SOAL -->
<div id="hal1">
<div class="card">
<h2>📝 Buat Ujian Baru, Pak</h2>
<input id="judul" placeholder="Judul Ujian, contoh: Aqidah Akhlak - Bab 1" value="Aqidah Akhlak">
<input id="mapel" placeholder="Mapel" value="Aqidah Akhlak">
<input id="kelasUjian" placeholder="Kelas, contoh: XI AKL" value="XI AKL">
<input id="waktu" type="number" placeholder="Waktu (menit)" value="15">
</div>

<div class="card">
<h2>➕ Tambah Soal</h2>
<textarea id="tanya" rows="2" placeholder="Tulis pertanyaan..."></textarea>
<input id="optA" placeholder="Jawaban A">
<input id="optB" placeholder="Jawaban B">
<input id="optC" placeholder="Jawaban C">
<input id="optD" placeholder="Jawaban D">
<select id="kunci"><option value="0">Kunci: A</option><option value="1">Kunci: B</option><option value="2">Kunci: C</option><option value="3">Kunci: D</option></select>
<button class="btn-biru" onclick="tambahSoal()">➕ TAMBAH SOAL</button>
<div id="listSoal"></div>
</div>

<div class="card">
<button class="btn-hijau" onclick="buatQR()">✅ BUAT QR UJIAN & LANJUT KE HALAMAN 2</button>
<button class="btn-abu" onclick="hapusSemua()">🗑️ Hapus Semua Soal</button>
</div>
</div>

<!-- HALAMAN 2 : QR + NILAI -->
<div id="hal2" style="display:none">
<div class="card" id="qrBox">
<h2>✅ QR Berhasil Dibuat, Pak. Silakan tampilkan.</h2>
<div id="infoUjian"></div>
<img id="imgQR">
<button class="btn-hijau" onclick="salinLink()">📋 SALIN LINK UJIAN</button>
<button class="btn-biru" onclick="keHal1()">⬅️ KEMBALI KE HALAMAN 1</button>
<button class="btn-abu" onclick="window.print()">🖨️ PRINT / SIMPAN QR JADI PDF</button>
</div>

<div class="card">
<h2>📋 Nilai Siswa - Hanya Di Sini, Pak</h2>
<div id="listNilai">Belum ada nilai.</div>
<button class="btn-ungu" onclick="bukaScan()">📷 SCAN QR NILAI SISWA</button>
<div id="kotakScan">
<div id="reader" style="width:100%"></div>
<button style="background:#ef4444;color:#fff" onclick="tutupScan()">❌ TUTUP KAMERA</button>
<p style="color:#fff;text-align:center;font-size:13px">Arahkan kamera ke QR Nilai di HP siswa, Pak.</p>
</div>
<button class="btn-hitam" onclick="exportExcel()">📦 Export Nilai ke Excel</button>
<button class="btn-abu" onclick="hapusNilai()">🗑️ Hapus Semua Nilai</button>
</div>
</div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
let soalList = JSON.parse(localStorage.getItem("soalList")||"[]");
let daftarNilai = JSON.parse(localStorage.getItem("daftarNilai")||"[]");
let linkUjian = "";
let html5Qr = null;

function renderSoal(){
  document.getElementById("listSoal").innerHTML = soalList.map((s,i)=>`<div class="soal-item"><b>${i+1}. ${s.q}</b><br>A. ${s.opts[0]}<br>B. ${s.opts[1]}<br>C. ${s.opts[2]}<br>D. ${s.opts[3]}<br>🔑 Kunci: ${"ABCD"[s.kunci]} <button style="width:auto;padding:6px 10px;background:#ef4444;color:#fff" onclick="hapusSoal(${i})">Hapus</button></div>`).join("") || "<p style='color:#64748b'>Belum ada soal, Pak.</p>";
}
function tambahSoal(){
  let q=document.getElementById("tanya").value.trim();
  let opts=[optA.value.trim(),optB.value.trim(),optC.value.trim(),optD.value.trim()];
  if(!q||opts.some(o=>!o)){alert("Lengkapi soal & 4 jawaban dulu, Pak.");return;}
  soalList.push({q,opts,kunci:parseInt(kunci.value)});
  localStorage.setItem("soalList",JSON.stringify(soalList));
  tanya.value="";optA.value="";optB.value="";optC.value="";optD.value="";
  renderSoal();
}
function hapusSoal(i){ soalList.splice(i,1); localStorage.setItem("soalList",JSON.stringify(soalList)); renderSoal(); }
function hapusSemua(){ if(confirm("Hapus semua soal, Pak?")){soalList=[];localStorage.removeItem("soalList");renderSoal();} }

function buatQR(){
  if(soalList.length==0){alert("Belum ada soal, Pak. Tambah dulu, Pak.");return;}
  let data={judul:judul.value,mapel:mapel.value,kelas:kelasUjian.value,waktu:parseInt(waktu.value)||15,soal:soalList};
  localStorage.setItem("ujianAktif",JSON.stringify(data));
  let base = location.href.replace("buat-soal.html","").replace("buat-soal","").split("?")[0];
  if(!base.endsWith("/")) base+="/";
  // Link siswa bawa data ujian di URL, jadi siswa tidak perlu login
  linkUjian = base + "siswa-soal.html?ujian=" + encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(data)))));
  document.getElementById("infoUjian").innerHTML = `<b>${data.judul}</b><br>${data.mapel} | Kelas ${data.kelas} | ${data.soal.length} Soal | ${data.waktu} Menit`;
  document.getElementById("imgQR").src = "https://api.qrserver.com/v1/create-qr-code/?size=300x300&data="+encodeURIComponent(linkUjian);
  document.getElementById("hal1").style.display="none";
  document.getElementById("hal2").style.display="block";
  tampilNilai();
  window.scrollTo(0,0);
}
function keHal1(){ document.getElementById("hal1").style.display="block"; document.getElementById("hal2").style.display="none"; }
function salinLink(){ navigator.clipboard.writeText(linkUjian).then(()=>alert("Link tersalin, Pak!")); }

function tampilNilai(){
  let el=document.getElementById("listNilai");
  if(daftarNilai.length==0){el.innerHTML="Belum ada nilai.";return;}
  el.innerHTML = daftarNilai.map((n,i)=>`${i+1}. <b>${n.nama}</b> (${n.kelas}) - ${n.mapel} : <b>${n.nilai}</b> (${n.benar}/${n.total})`).join("<br>");
}
function hapusNilai(){ if(confirm("Hapus semua nilai, Pak?")){daftarNilai=[];localStorage.removeItem("daftarNilai");tampilNilai();} }

function bukaScan(){
  document.getElementById("kotakScan").style.display="block";
  html5Qr = new Html5Qrcode("reader");
  html5Qr.start({facingMode:"environment"},{fps:10,qrbox:250},
    (teks)=>{
      if(teks.startsWith("NILAI|")){
        let p=teks.split("|");
        let baru={nama:p[1],kelas:p[2],mapel:p[3],nilai:p[4],benar:p[5],total:p[6]};
        if(!daftarNilai.find(x=>x.nama==baru.nama && x.kelas==baru.kelas && x.mapel==baru.mapel)){
          daftarNilai.push(baru); localStorage.setItem("daftarNilai",JSON.stringify(daftarNilai)); tampilNilai();
          alert("✅ Masuk, Pak! "+baru.nama+" - Nilai "+baru.nilai);
        } else alert("⚠️ Sudah di-scan, Pak! "+baru.nama);
        tutupScan();
      }
    },()=>{}
  ).catch(e=>alert("Kamera tidak bisa dibuka, Pak. Cek izin kamera di Chrome, harus Allow, Pak. Jangan pakai Mode Desktop, pakai Mode HP biasa, Pak."));
}
function tutupScan(){
  if(html5Qr){ html5Qr.stop().then(()=>{html5Qr.clear();document.getElementById("kotakScan").style.display="none";}).catch(()=>{document.getElementById("kotakScan").style.display="none";}); }
  else document.getElementById("kotakScan").style.display="none";
}
function exportExcel(){
  if(daftarNilai.length==0){alert("Belum ada nilai, Pak.");return;}
  let csv="No,Nama,Kelas,Mapel,Nilai,Benar,Total\n"+daftarNilai.map((n,i)=>(i+1)+","+n.nama+","+n.kelas+","+n.mapel+","+n.nilai+","+n.benar+","+n.total).join("\n");
  let blob=new Blob(["\ufeff"+csv],{type:"text/csv"}); let a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="Nilai-Ujian.csv"; a.click();
}
renderSoal(); tampilNilai();
</script>
</body>
</html>
