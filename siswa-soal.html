<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ujian Siswa</title>
<style>
body{font-family:Arial,sans-serif;max-width:600px;margin:0 auto;padding:12px;background:#f6f6f6}
.card{background:#fff;padding:14px;border-radius:12px;margin-bottom:12px;box-shadow:0 1px 4px #ccc}
input{width:100%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box;font-size:16px}
button{width:100%;padding:14px;margin:6px 0;border:none;border-radius:10px;font-size:17px;font-weight:bold;cursor:pointer;color:#fff}
.biru{background:#1a73e8}.hijau{background:#0f9d58}.abu{background:#5f6368}
.soal{border:1px solid #ddd;border-radius:10px;padding:12px;margin-bottom:12px;background:#fff}
.soal p{font-weight:bold;margin:0 0 8px 0}
label{display:block;padding:10px;margin:5px 0;border:1px solid #ddd;border-radius:8px;cursor:pointer}
label:has(input:checked){background:#e8f0fe;border-color:#1a73e8}
.hidden{display:none}
.center{text-align:center}
.nilai{font-size:48px;font-weight:bold;color:#0f9d58}
</style>
</head>
<body>

<div id="halIsi" class="card">
<h2 id="judul">📝 Ujian</h2>
<p>Isi Nama Lengkap, Pakai Huruf Besar Semua Ya.</p>
<label>Nama Siswa</label>
<input id="nama" placeholder="Contoh: AHMAD FAUZI">
<label>Kelas</label>
<input id="kelas" placeholder="Contoh: 7A">
<div id="daftarSoal"></div>
<button class="hijau" onclick="kumpul()">✅ KUMPULKAN JAWABAN</button>
</div>

<div id="halHasil" class="card hidden center">
<h2>✅ Sudah Terkumpul!</h2>
<p id="namaHasil"></p>
<div class="nilai" id="nilaiAngka">0</div>
<p id="detailNilai"></p>
<p><small>📸 Screenshot halaman ini, kirim ke Pak Guru via WA ya.</small></p>
<button class="biru" onclick="salinNilai()">📋 SALIN NILAI - KIRIM KE WA GURU</button>
<button class="abu" onclick="location.reload()">🔄 ULANGI</button>
</div>

<script>
let soalList=[], mapel="Ujian";
function getParam(n){ return new URLSearchParams(window.location.search).get(n); }

function loadSoal(){
  let d = getParam('d');
  let dataLama = getParam('data');
  try{
    if(d){
      // FORMAT BARU PENDEK: Mapel~Soal|A|B|C|D|KunciAngka~Soal2|...
      let teks = decodeURIComponent(d);
      let parts = teks.split('~');
      mapel = parts[0] || "Ujian";
      for(let i=1;i<parts.length;i++){
        let p = parts[i].split('|');
        if(p.length>=6){
          let idx = parseInt(p[5]) || 0;
          let kunciHuruf = ["A","B","C","D"][idx];
          soalList.push({soal:p[0], a:p[1], b:p[2], c:p[3], d:p[4], kunci:kunciHuruf});
        }
      }
    } else if(dataLama){
      // FORMAT LAMA - Buat jaga-jaga kalau QR lama
      let j = JSON.parse(decodeURIComponent(escape(atob(dataLama))));
      mapel = j.m || j.mapel || "Ujian";
      let arr = j.s || j.soal || [];
      arr.forEach(s=>{
        if(Array.isArray(s)) soalList.push({soal:s[0],a:s[1],b:s[2],c:s[3],d:s[4],kunci:s[5]});
        else soalList.push(s);
      });
    }
  }catch(e){
    document.getElementById('daftarSoal').innerHTML='<p style="color:red">❌ Link soal tidak terbaca. Minta Pak Guru buat QR baru ya.</p>';
    return;
  }

  if(soalList.length==0){
    document.getElementById('daftarSoal').innerHTML='<p>❌ Soal tidak ditemukan. Scan QR lagi ya.</p>';
    return;
  }

  document.getElementById('judul').innerText = "📝 Ujian - " + mapel + " (" + soalList.length + " Soal)";
  let html="";
  soalList.forEach((s,i)=>{
    html += '<div class="soal"><p>'+(i+1)+'. '+s.soal+'</p>'
    + '<label><input type="radio" name="q'+i+'" value="A"> A. '+s.a+'</label>'
    + '<label><input type="radio" name="q'+i+'" value="B"> B. '+s.b+'</label>'
    + '<label><input type="radio" name="q'+i+'" value="C"> C. '+s.c+'</label>'
    + '<label><input type="radio" name="q'+i+'" value="D"> D. '+s.d+'</label></div>';
  });
  document.getElementById('daftarSoal').innerHTML=html;
}

function kumpul(){
  let nama=document.getElementById('nama').value.trim();
  let kelas=document.getElementById('kelas').value.trim();
  if(!nama){ alert('Isi Nama dulu ya.'); return; }
  let benar=0;
  soalList.forEach((s,i)=>{
    let pilih=document.querySelector('input[name="q'+i+'"]:checked');
    if(pilih && pilih.value==s.kunci) benar++;
  });
  let nilai=Math.round(benar/soalList.length*100);
  document.getElementById('halIsi').classList.add('hidden');
  document.getElementById('halHasil').classList.remove('hidden');
  document.getElementById('namaHasil').innerText=nama+" - Kelas "+kelas+" - "+mapel;
  document.getElementById('nilaiAngka').innerText=nilai;
  document.getElementById('detailNilai').innerText="Benar "+benar+" dari "+soalList.length+" soal";
  window._nilaiTerakhir={nama:nama,kelas:kelas,mapel:mapel,nilai:nilai,benar:benar,total:soalList.length};
  window.scrollTo(0,0);
}
function salinNilai(){
  let n=window._nilaiTerakhir;
  if(!n) return;
  let teks="Nilai Ujian "+n.mapel+"\nNama: "+n.nama+"\nKelas: "+n.kelas+"\nNilai: "+n.nilai+"\nBenar: "+n.benar+" dari "+n.total;
  navigator.clipboard.writeText(teks).then(()=>alert('Nilai tersalin! Tempel di WA Pak Guru ya.'));
}
loadSoal();
</script>
</body>
</html>
