<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ujian Siswa</title>
<style>
body{font-family:Arial,sans-serif;background:#eef2ff;margin:0;padding:12px}
.card{background:#fff;padding:16px;border-radius:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
input{width:100%;padding:12px;margin:6px 0;border:1px solid #cbd5e1;border-radius:10px;box-sizing:border-box;font-size:15px}
button{width:100%;padding:14px;border:none;border-radius:10px;font-weight:bold;font-size:16px;margin-top:8px;cursor:pointer}
.btn-hijau{background:#16a34a;color:#fff}
.btn-biru{background:#2563eb;color:#fff}
.opt{display:block;background:#f8fafc;border:2px solid #e2e8f0;padding:12px;border-radius:10px;margin:6px 0;cursor:pointer}
.opt.aktif{background:#dbeafe;border-color:#2563eb}
#hasil{text-align:center}
#qrNilai{width:210px;height:210px;margin:10px auto;display:block}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" class="card">
<h2>🏫 <span id="judulLogin">Masuk Ujian</span></h2>
<p id="infoLogin" style="color:#475569"></p>
<input id="nama" placeholder="Tulis Nama Lengkap Kamu">
<input id="kelas" placeholder="Kelas, contoh: XI AKL">
<button class="btn-hijau" onclick="masuk()">MASUK & MULAI UJIAN</button>
</div>

<!-- SOAL -->
<div id="ujian" class="card" style="display:none">
<h3 id="judulUjian"></h3>
<p id="sisaWaktu" style="color:#dc2626;font-weight:bold"></p>
<div id="soalBox"></div>
<button class="btn-biru" onclick="kumpul()">✅ KUMPULKAN</button>
</div>

<!-- HASIL + QR NILAI -->
<div id="hasil" class="card" style="display:none">
<h2>✅ Sudah Terkumpul!</h2>
<p id="namaHasil"></p>
<h1 id="nilaiHasil" style="font-size:56px;color:#16a34a;margin:5px 0">0</h1>
<p id="benarHasil"></p>
<div style="background:#f0fdf4;border:2px dashed #22c55e;padding:12px;border-radius:12px">
<b>📷 TUNJUKKAN QR INI KE PAK GURU</b><br>
<img id="qrNilai">
<small>Bapak scan, nilai langsung masuk</small>
</div>
<button class="btn-biru" onclick="salinNilai()">📋 SALIN NILAI - KIRIM WA GURU</button>
<p style="color:#64748b;font-size:13px">📸 Screenshot halaman ini, kirim ke Pak Guru juga boleh.</p>
</div>

<script>
let data=null, jawaban={}, nama="", kelas="", sisa=0, timer=null;
try{
  let p=new URLSearchParams(location.search).get("ujian");
  if(p) data=JSON.parse(decodeURIComponent(escape(atob(p))));
  if(!data) data=JSON.parse(localStorage.getItem("ujianAktif")||"null");
}catch(e){}
if(data){ document.getElementById("judulLogin").textContent=data.judul; document.getElementById("infoLogin").textContent="Kelas "+data.kelas+" | "+data.soal.length+" Soal | "+data.waktu+" Menit";else{
  document.getElementById("infoLogin").innerHTML="<b style='color:red'>⚠️ LINK SALAH, PAK! Jangan buka langsung.<br>Scan QR dari Pak Guru / Pencet SALIN LINK UJIAN.</b>";
  document.getElementById("judulLogin").textContent="Link Kosong - Tidak Ada Soal";
}

function masuk(){
  nama=document.getElementById("nama").value.trim(); kelas=document.getElementById("kelas").value.trim();
  if(!nama||!kelas){alert("Isi Nama & Kelas dulu.");return;}
  if(!data){alert("⚠️ LINK SALAH, PAK! Ini Link kosong, tidak ada soal.\n\nJangan buka siswa-soal.html langsung, Pak.\nBuka lewat QR / SALIN LINK UJIAN di HP Pak Guru, Pak.");return;}
  document.getElementById("login").style.display="none";
  document.getElementById("ujian").style.display="block";
  document.getElementById("judulUjian").textContent=data.judul;
  sisa=data.waktu*60;
  renderSoal();
  timer=setInterval(()=>{ sisa--; let m=Math.floor(sisa/60), d=sisa%60; document.getElementById("sisaWaktu").textContent="⏰ Sisa: "+m+":"+String(d).padStart(2,"0"); if(sisa<=0){clearInterval(timer); kumpul();} },1000);
}
function renderSoal(){
  document.getElementById("soalBox").innerHTML=data.soal.map((s,i)=>`
  <div style="margin-bottom:16px"><b>${i+1}. ${s.q}</b>
  ${s.opts.map((o,oi)=>`<label class="opt" id="opt-${i}-${oi}" onclick="pilih(${i},${oi})">${"ABCD"[oi]}. ${o}</label>`).join("")}
  </div>`).join("");
}
function pilih(i,oi){ jawaban[i]=oi; for(let k=0;k<4;k++) document.getElementById(`opt-${i}-${k}`).classList.remove("aktif"); document.getElementById(`opt-${i}-${oi}`).classList.add("aktif"); }
function kumpul(){
  clearInterval(timer);
  let benar=0; data.soal.forEach((s,i)=>{ if(jawaban[i]==s.kunci) benar++; });
  let nilai=Math.round(benar/data.soal.length*100);
  document.getElementById("ujian").style.display="none";
  document.getElementById("hasil").style.display="block";
  document.getElementById("namaHasil").textContent=nama+" - Kelas "+kelas+" - "+data.mapel;
  document.getElementById("nilaiHasil").textContent=nilai;
  document.getElementById("benarHasil").textContent="Benar "+benar+" dari "+data.soal.length+" soal";
  // QR NILAI untuk di-scan guru - format: NILAI|Nama|Kelas|Mapel|Nilai|Benar|Total
  let dataQR="NILAI|"+nama+"|"+kelas+"|"+data.mapel+"|"+nilai+"|"+benar+"|"+data.soal.length;
  document.getElementById("qrNilai").src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data="+encodeURIComponent(dataQR);
  window._teksNilai=`Nilai Ujian\nNama: ${nama}\nKelas: ${kelas}\nMapel: ${data.mapel}\nNilai: ${nilai}\nBenar: ${benar}/${data.soal.length}`;
}
function salinNilai(){ navigator.clipboard.writeText(window._teksNilai||"").then(()=>alert("Tersalin, Pak! Tinggal paste di WA.")); }
</script>
</body>
</html>
