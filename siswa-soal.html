<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kerjakan Soal - Al Manar</title><style>body{font-family:sans-serif;padding:15px;background:#e8f0fe}input,button{width:100%;padding:12px;margin:5px 0;border-radius:8px;border:1px solid #ccc}button{background:#00a400;color:#fff;border:none;font-weight:bold}.soal{background:#fff;padding:12px;border-radius:10px;margin:10px 0}#timer{position:sticky;top:0;background:#ff0000;color:#fff;padding:12px;text-align:center;font-size:20px;font-weight:bold;border-radius:10px;z-index:99}img{max-width:260px}.opt{display:flex!important;align-items:center!important;gap:10px!important;padding:12px!important;border:1px solid #ddd!important;border-radius:10px!important;margin:6px 0!important;background:#fff!important;cursor:pointer}
.opt input{width:22px!important;height:22px!important;flex-shrink:0!important;margin:0!important;accent-color:#1a73e8}
.opt span{font-size:16px!important;line-height:1.3}
.opt:has(input:checked){background:#e8f0fe!important;border-color:#1a73e8!important}</style></head><body>
<div id="timer"></div><h2 id="judulSoal"></h2><p id="namaSiswa"></p><div id="area"></div>
<script>
let soalData=[], judul="", sisaDetik=0, timerInterval;
window.onload=()=>{
  let data=JSON.parse(localStorage.getItem('ujian_siswa')||'null');
  let nama=localStorage.getItem('siswa_nama')||"Tanpa Nama";
  let kelas=localStorage.getItem('siswa_kelas')||"";
  if(!data) return document.getElementById('area').innerHTML="Ujian tidak ditemukan!";
  soalData=data.s; judul=data.j; sisaDetik=(data.t||30)*60;
  document.getElementById('judulSoal').innerText="📚 "+judul;
  document.getElementById('namaSiswa').innerText="👦 "+nama+" | Kelas: "+kelas;
  soalData=soalData.sort(()=>Math.random()-0.5);
  soalData=soalData.map(s=>{
    let opts=[{k:'A',t:s.a},{k:'B',t:s.b},{k:'C',t:s.c},{k:'D',t:s.d}];
    let benarTeks=s[{A:'a',B:'b',C:'c',D:'d'}[s.k]];
    opts=opts.sort(()=>Math.random()-0.5);
    let newK=['A','B','C','D'][opts.findIndex(o=>o.t==benarTeks)];
    return {q:s.q, a:opts[0].t, b:opts[1].t, c:opts[2].t, d:opts[3].t, k:newK};
  });
  tampilSoal(); mulaiTimer();
};
function mulaiTimer(){
  timerInterval=setInterval(()=>{
    let m=Math.floor(sisaDetik/60), d=sisaDetik%60;
    document.getElementById('timer').innerText=`⏰ SISA: ${m}:${d<10?'0':''}${d}`;
    if(sisaDetik<=0){clearInterval(timerInterval); alert("Waktu Habis! Otomatis dikirim!"); kirim();}
    sisaDetik--;
  },1000);
}
function tampilSoal(){
  let h="";
  soalData.forEach((s,i)=>{ h+=`<div class="soal"><b>${i+1}. ${s.q}</b><br><label class="opt"><input type="radio" name="q${i}" value="A"><span><b>A.</b> ${s.a}</span></label><label class="opt"><input type="radio" name="q${i}" value="B"><span><b>B.</b> ${s.b}</span></label><label class="opt"><input type="radio" name="q${i}" value="C"><span><b>C.</b> ${s.c}</span></label><label class="opt"><input type="radio" name="q${i}" value="D"><span><b>D.</b> ${s.d}</span></label></div>`});
  h+=`<button onclick="kirim()">KIRIM JAWABAN</button>`; document.getElementById('area').innerHTML=h;
}
function kirim(){
  clearInterval(timerInterval);
  let benar=0; soalData.forEach((s,i)=>{let j=document.querySelector(`input[name="q${i}"]:checked`); if(j&&j.value==s.k) benar++});
  let nilai=Math.round(benar/soalData.length*100);
  let nama=localStorage.getItem('siswa_nama')||"Tanpa Nama";
  let kelas=localStorage.getItem('siswa_kelas')||"";
  let hasil={nama:nama+" ("+kelas+")",nilai:nilai,benar:benar,total:soalData.length,waktu:new Date().toLocaleString('id-ID')};
  let code=btoa(JSON.stringify(hasil));
  document.getElementById('timer').style.display='none';
  document.getElementById('area').innerHTML=`<div style="background:#fff;padding:20px;border-radius:15px;text-align:center"><h2>✅ Terkirim!</h2><h1>Nilai: ${nilai}</h1><p>${nama} - Kelas ${kelas}</p><p>Benar ${benar} dari ${soalData.length}</p><p>Tunjukkan QR ini ke Guru!</p><img src="https://api.qrserver.com/v1/create-qr-code/?size=260x260&data=${code}"></div>`;
}
</script></body></html>
